name: Nightly Release & Integration Tests

on:
  schedule:
    # Every day at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # There is one engine since the legacy sdk/mpr backend was deleted
        # (docs/plans/2026-09-14-retire-legacy-engine.md), so the matrix is over
        # Mendix versions alone. MXCLI_TEST_ENGINES is left unset: its default is
        # every engine, and a name that no longer exists fails loudly rather than
        # selecting nothing.
        mendix-version:
          - '10.24.24.119349'
          - '11.6.8'
          - '11.12.2'
          - '11.13.0'
          - '11.14.0'
          - '11.15.0'
          - '11.16.0'
      fail-fast: false
    name: test (Mendix ${{ matrix.mendix-version }})
    steps:
      - uses: actions/checkout@v7
        with:
          # testdata/testapp (ako/TestApp) is the Studio Pro-authored fixture
          # the roundtrip suite and mdl/backend/modelsdk read (#743); without it
          # those tests skip, as push-test.yml's roundtrip/parity jobs know.
          # upgrade-full-corpus (PedApp only) and the release job do not read
          # it and check out without it.
          submodules: true

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'

      - name: Cache ANTLR4 JAR
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/antlr/antlr4
          key: antlr4-4.13.2
      - name: Install ANTLR4
        run: pip install 'antlr4-tools==0.2.2'
      - name: Generate parser
        run: make grammar
        env:
          ANTLR4_TOOLS_ANTLR_VERSION: '4.13.2'
      - name: Build
        run: make build

      - name: Unit tests
        run: make test

      - name: Setup mxbuild ${{ matrix.mendix-version }}
        run: ./bin/mxcli setup mxbuild --version ${{ matrix.mendix-version }}

      # One step, every package: go test runs the packages in parallel, so the
      # wall time is the slowest one's (mdl/roundtrip, ~21 min on this runner in
      # ako/mxcli#757's measurement) and grows as the round trip gains fixtures.
      # Per-PR CI splits this into parallel jobs instead (push-test.yml).
      - name: "Integration tests (Mendix ${{ matrix.mendix-version }})"
        run: make test-integration
        timeout-minutes: 60

  # Mendix 9.24 (the last 9.x LTS), kept OUT of the `test` matrix on purpose:
  # `nightly` needs `test`, and 9.x still has known writer bugs, so a matrix
  # entry would block every release until they are fixed. continue-on-error
  # keeps a red run from failing the workflow while the failures stay visible
  # in the job log. Once this job is green, fold the version into the `test`
  # matrix and delete this job.
  test-mendix-9:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      MENDIX_VERSION: '9.24.30.51827'
    name: test (Mendix 9.24.30.51827, non-gating)
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'

      # mxbuild 9 draws through System.Drawing; without libgdiplus every mx call
      # dies with "The type initializer for 'Gdip' threw an exception."
      - name: Install libgdiplus
        run: sudo apt-get update && sudo apt-get install -y libgdiplus

      # The 9.x runtime and its Gradle build need JDK 17; pin it rather than
      # relying on the runner image's default JAVA_HOME.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache ANTLR4 JAR
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/antlr/antlr4
          key: antlr4-4.13.2
      - name: Install ANTLR4
        run: pip install 'antlr4-tools==0.2.2'
      - name: Generate parser
        run: make grammar
        env:
          ANTLR4_TOOLS_ANTLR_VERSION: '4.13.2'
      - name: Build
        run: make build

      # No `make test`: the unit tests are version-independent and already run
      # in every `test` matrix entry.

      - name: Setup mxbuild ${{ env.MENDIX_VERSION }}
        run: ./bin/mxcli setup mxbuild --version ${{ env.MENDIX_VERSION }}

      - name: "Integration tests (Mendix ${{ env.MENDIX_VERSION }})"
        run: make test-integration
        timeout-minutes: 60

  # The tunnel seam's !linux stub on macOS (ADR-0009) -- the ONLY place it runs.
  # push-test.yml runs it on Windows, on every PR and main push; macOS left
  # that workflow because its hosted queue failed to deliver a runner for a
  # third of main pushes. This catches a darwin-only break within a day; run it
  # on demand with workflow_dispatch. Like upgrade-full-corpus it does not gate
  # the release: a nightly is not held back by a macOS queue flake.
  tunnel-seam-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - name: Test the tunnel seam
        run: bash scripts/test-tunnel-seam.sh

  # The upgrade property test over the WHOLE mdl-examples corpus, header-only
  # scripts included (MXCLI_UPGRADE_ALL). Per-PR CI executes only the scripts
  # the upgrade rewrites beyond the header and terminators; this is the run that
  # proves langver's gating on the rest (ako/mxcli#757). Independent of the
  # Mendix version — it runs on the committed PedApp fixture and never calls
  # mx — so it runs once, not per matrix entry. It does not gate the release.
  upgrade-full-corpus:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/3', '2/3', '3/3']
    name: upgrade full corpus (${{ matrix.shard }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - name: Cache ANTLR4 JAR
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/antlr/antlr4
          key: antlr4-4.13.2
      - name: Install ANTLR4
        run: pip install 'antlr4-tools==0.2.2'
      - name: Generate parser
        run: make grammar
        env:
          ANTLR4_TOOLS_ANTLR_VERSION: '4.13.2'
      - name: Build
        run: make build
      - name: Upgrade property test, full corpus (${{ matrix.shard }})
        run: make test-integration-upgrade
        env:
          MXCLI_UPGRADE_ALL: '1'
          MXCLI_UPGRADE_SHARD: ${{ matrix.shard }}
        timeout-minutes: 45

  # The agent dev-loop benchmark (docs/11-proposals/PROPOSAL_agent_devloop_benchmark.md):
  # a scripted session of the mxcli commands an agent runs, timed one process
  # per command. A hosted runner's speed varies from night to night by more
  # than most regressions, so the job does not compare tonight with last
  # night: it downloads the previous nightly's binary and runs both
  # interleaved on THIS runner, and reports the ratio. The record goes to the
  # `benchmarks` branch, one file per run.
  #
  # Three sessions. Two time mxcli alone and start from the committed PedApp
  # fixture. The third times the running app -- boot, a hot change, an entity
  # change, a page check, tests -- on a project `mxcli new` creates, and so
  # needs mxbuild and the runtime (mxcli downloads both), JDK 21 for the
  # runtime, and a browser for the page check. It runs last: if it fails, the
  # record of the first two is still written and committed.
  #
  # Does not gate the release, like upgrade-full-corpus: a slow night must not
  # hold a nightly back. The driver exits non-zero only when a command fails
  # or re-running a settled script changes a file.
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    name: agent dev-loop benchmark
    env:
      # One version, the one the running-app session was developed against.
      # Moving it is a deliberate change: boot and apply times differ between
      # Mendix versions, so the trend restarts where it moves.
      BENCH_MENDIX_VERSION: '11.13.0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - name: Cache ANTLR4 JAR
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/antlr/antlr4
          key: antlr4-4.13.2
      - name: Install ANTLR4
        run: pip install 'antlr4-tools==0.2.2'
      - name: Generate parser
        run: make grammar
        env:
          ANTLR4_TOOLS_ANTLR_VERSION: '4.13.2'

      # The Mendix 11 runtime launches under JDK 21; the runner's default
      # `java` is older.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # `mxcli playwright check` requires the `playwright` package from the
      # global node_modules and launches its Chromium.
      - name: Install Playwright and Chromium
        run: |
          npm install -g playwright@1.63.0
          npx --yes playwright@1.63.0 install --with-deps chromium

      # First, before the `nightly` job can replace the release. That job
      # waits for the whole `test` matrix, but nothing here relies on it: the
      # record names the baseline's version, and with no baseline the run
      # still measures, without ratios.
      - name: Download the previous nightly binary
        id: baseline
        run: |
          mkdir -p "$RUNNER_TEMP/baseline"
          if gh release download nightly --repo "$GITHUB_REPOSITORY" \
               --pattern mxcli-linux-amd64 --dir "$RUNNER_TEMP/baseline"; then
            chmod +x "$RUNNER_TEMP/baseline/mxcli-linux-amd64"
            echo "path=$RUNNER_TEMP/baseline/mxcli-linux-amd64" >> "$GITHUB_OUTPUT"
          else
            echo "No previous nightly binary: measuring without an A/B."
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run the benchmark
        run: |
          make bench BASELINE="${{ steps.baseline.outputs.path }}" \
            BENCH_RUNTIME="$BENCH_MENDIX_VERSION" \
            BENCH_FLAGS="-out agentbench-record.json -summary $GITHUB_STEP_SUMMARY"

      - name: Upload the record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-benchmark-record
          path: agentbench-record.json
          if-no-files-found: ignore

      # One file per run, so two runs never edit the same file; the retry is
      # for two runs pushing at once. An orphan branch: results only, never
      # merged. Runs from another branch (workflow_dispatch) are not history.
      - name: Commit the record to the benchmarks branch
        # hashFiles sees the workspace only, which is why the record is written there.
        if: always() && github.ref == 'refs/heads/main' && hashFiles('agentbench-record.json') != ''
        run: |
          set -euo pipefail
          sha=$(git rev-parse --short HEAD)
          file="results/$(date -u +%Y/%m)/$(date -u +%Y-%m-%dT%H%M)-$sha.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin benchmarks:benchmarks 2>/dev/null; then
            git worktree add "$RUNNER_TEMP/benchmarks" benchmarks
          else
            git worktree add --detach "$RUNNER_TEMP/benchmarks"
            git -C "$RUNNER_TEMP/benchmarks" checkout --orphan benchmarks
            git -C "$RUNNER_TEMP/benchmarks" rm -rf -q .
            printf '%s\n' '# Agent dev-loop benchmark records' '' \
              'One JSON file per nightly run, written by the `bench` job of `.github/workflows/nightly.yml`.' \
              'Never merged into `main`. How to read a record: `docs-site/src/internals/agent-benchmark.md` on `main`.' \
              > "$RUNNER_TEMP/benchmarks/README.md"
          fi
          cd "$RUNNER_TEMP/benchmarks"
          mkdir -p "$(dirname "$file")"
          cp "$GITHUB_WORKSPACE/agentbench-record.json" "$file"
          git add -A
          git commit -q -m "bench: $sha"
          for attempt in 1 2 3; do
            if git push origin benchmarks; then exit 0; fi
            git pull --rebase origin benchmarks
          done
          exit 1

  nightly:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'

      - uses: oven-sh/setup-bun@v2

      - name: Cache ANTLR4 JAR
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/antlr/antlr4
          key: antlr4-4.13.2
      - name: Install ANTLR4
        run: pip install 'antlr4-tools==0.2.2'
      - name: Generate parser
        run: make grammar
        env:
          ANTLR4_TOOLS_ANTLR_VERSION: '4.13.2'

      - name: Check for new commits since last nightly
        id: check
        run: |
          LAST_NIGHTLY=$(gh release view nightly --json publishedAt -q .publishedAt 2>/dev/null || echo "")
          if [ -n "$LAST_NIGHTLY" ]; then
            COMMITS=$(git log --since="$LAST_NIGHTLY" --oneline origin/main | wc -l)
            if [ "$COMMITS" -eq 0 ]; then
              echo "No new commits since last nightly, skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "$COMMITS new commit(s) since last nightly."
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build release binaries
        if: steps.check.outputs.skip != 'true'
        run: VERSION=nightly-$(date -u +%Y%m%d)-$(git rev-parse --short HEAD) make release

      - name: Generate changelog
        if: steps.check.outputs.skip != 'true'
        id: changelog
        run: |
          {
            echo "body<<NIGHTLY_EOF"
            echo "**Nightly build from \`main\` — $(date -u +%Y-%m-%d)**"
            echo ""
            echo "Commit: [\`$(git rev-parse --short HEAD)\`](https://github.com/${{ github.repository }}/commit/$(git rev-parse HEAD))"
            echo ""
            echo "### Recent changes"
            echo ""
            git log --oneline -20 origin/main
            echo ""
            echo "> This is an automated pre-release build. Use tagged releases for production."
            echo "NIGHTLY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Delete previous nightly release
        if: steps.check.outputs.skip != 'true'
        run: gh release delete nightly --cleanup-tag -y 2>/dev/null || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create nightly release
        if: steps.check.outputs.skip != 'true'
        # Pass the notes body via an env var, NOT via `${{ }}` interpolation into
        # the shell. Interpolating it directly lets the shell re-interpret the
        # body's backticks (command substitution) and double quotes (from commit
        # subjects in the git log), which broke the release step. `"$NOTES"` is
        # inert literal data.
        run: |
          gh release create nightly \
            --prerelease \
            --title "Nightly $(date -u +%Y-%m-%d)" \
            --notes "$NOTES" \
            bin/mxcli-*
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ steps.changelog.outputs.body }}
