name: Build, Test & Lint

# One run per commit (ako/mxcli#1886). With `[push, pull_request]` every push to
# a PR branch ran this workflow twice, ~102 runner-minutes each, and the pair kept
# the account at its 20-concurrent-job limit for most of a busy window. The
# pull_request run is the one kept: it tests the merge result, not the branch.
#
# A branch without a PR no longer gets CI on push; start one by hand with
# workflow_dispatch (Actions tab, or `gh workflow run push-test.yml --ref <branch>`).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a PR cancels that PR's run still in progress: the superseded
# commit's result is never read, and it held its runners until it finished.
#
# Only PR runs share a group. Everything else (main, workflow_dispatch) gets a
# group of its own via run_id, because a shared group cancels even with
# cancel-in-progress false: GitHub keeps at most ONE pending run per group, so a
# third push to main would silently drop the queued second one, and main's
# commits must each be tested.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Checks that need no generated parser and no compile, run first and gating
  # every other job (ako/mxcli#1887). An unformatted file used to fail ~24 min
  # into build-and-test while all the integration legs ran anyway, ~100
  # runner-minutes for a known-red result, and at the 20-concurrent-job cap that
  # also delayed every other PR. Each check takes about a second; the job's cost
  # is runner start-up, so it saves no setup it does not need: no submodules, no
  # Go module or build cache (gofmt reads source only), no ANTLR.
  #
  # Only checks proven to run on a bare checkout belong here: `go vet` and
  # check-tunnel-deps load the package graph, which includes the generated
  # parser, so they stay in build-and-test.
  quick-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # The toolchain matters: gofmt's output differs between Go releases
          # (the mismatch fixed in #1759), so this must match the other jobs.
          go-version: '1.27.4'
          cache: false
      - name: Check gofmt
        run: make fmt-check
      - name: Check bug findings
        # One JSON object per line, an area, a date, and either the four
        # structured fields or a raw row. DuckDB rejects a whole file on one bad
        # line, so a typo in an appended finding takes out every query over that
        # area. Also prints how far docs-wiki/bug-patterns/ has fallen behind.
        run: make check-findings
      - name: Check wiki page list
        # The table of contents must describe the wiki, both directions. It
        # drifted for three months before anyone noticed.
        run: make check-wiki-pages
      - name: Check the skill section indexes
        # Each SKILL.md opens with a generated line-numbered index so an agent
        # can read one section instead of the file — measured on BENCH-001 as
        # ~68% of a session's re-read cost. A hand-kept table of contents is
        # the drift this repo has paid for twice, so the generator owns it.
        run: make check-skill-index
      - name: Check every go test sets -timeout
        # Without one Go applies 10m per test binary, and a package that passes
        # in seconds alone can exceed it under `./...` load (mendixlabs/mxcli#1291).
        run: make check-test-timeouts

  # The tunnel seam has a !linux half (stub + its tests) that the ubuntu job can
  # only compile, never run. This job actually executes it on real Windows and
  # macOS runners, so "--hub fails with an actionable message" is a tested claim
  # rather than a cross-compile that type-checked. See ADR-0009.
  #
  # Neither package depends on the generated ANTLR parser, so this needs no
  # grammar step and stays fast.
  tunnel-seam-cross-platform:
    needs: quick-checks
    strategy:
      fail-fast: false
      matrix:
        # Windows only; macOS runs nightly (nightly.yml, `tunnel-seam-macos`,
        # also on workflow_dispatch there). Windows executes the same !linux
        # stub, so macOS added only a darwin compile, while its hosted queue
        # never delivered a runner for 15 of 46 main pushes (2026-11-03..07):
        # the job was cancelled after ~15 min with every real job green, so
        # main read red for nothing. Off PRs first (#1916), now off main too.
        # Kept a one-entry matrix so the check name stays
        # `tunnel-seam-cross-platform (windows-latest)`.
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - name: Test the tunnel seam
        shell: bash
        run: bash scripts/test-tunnel-seam.sh

  # The Windows process helpers (cmd/mxcli/docker/procgroup_windows.go) cannot be
  # exercised by the ubuntu job: Signal(0) succeeds on Linux and there is no
  # process tree to reap. `mxcli run --local` hung forever on Windows at
  # "Starting mxbuild --serve..." because alive() asked Signal(0) (unsupported on
  # Windows, so a live mxbuild read as dead) and Stop() killed only the wrapper,
  # leaving mxbuild's Deno web-ext worker holding the stdout pipe so cmd.Wait()
  # blocked. This job runs the Windows-only regression tests on a real Windows
  # runner so neither half can come back.
  windows-process-regression:
    needs: quick-checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - name: Test the Windows process helpers
        shell: bash
        # Scoped with -run: the rest of the docker package's tests assert POSIX
        # file modes and shell out to `sh`, so the full package does not pass on
        # Windows (tracked in #897). The test binary is still COMPILED for this
        # platform, so a Windows build break in the package is caught too.
        #
        # -run can pass vacuously if the tests are renamed or deleted, so assert
        # that the expected number actually ran.
        #
        # `tee` rather than a command substitution — see the tunnel-seam job above.
        # This job is where it bit: a run of these tests failed with the log holding
        # only "Process completed with exit code 1", so the failing test could not be
        # named and the leftover `ping` in the runner's orphan-process cleanup was
        # the only evidence of WHICH test had tripped (ako/mxcli#594).
        run: |
          set +e
          go test -v -count=1 -run 'TestProcessAlive|TestKillProcessGroup|TestServeServer_AliveTracksProcess|TestLocalRuntime_AliveTracksProcess' ./cmd/mxcli/docker/ 2>&1 | tee go-test-output.txt
          status=${PIPESTATUS[0]}
          set -e
          n=$(grep -c '^--- PASS: Test' go-test-output.txt || true)
          echo "windows process tests executed: $n"
          if [ "$status" -ne 0 ]; then
            echo "FAIL: go test exited $status. Its output is above."
            exit "$status"
          fi
          if [ "$n" -lt 5 ]; then
            echo "FAIL: expected at least 5 Windows process tests to run, -run matched $n."
            echo "      procgroup_windows_test.go must keep its processAlive / tree-kill /"
            echo "      alive() tests, or the Windows local-boot regression is unguarded."
            exit 1
          fi

  build-and-test:
    needs: quick-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # testdata/testapp (ako/TestApp) is the round-trip harness's second
          # Studio Pro-authored fixture (#743); without it that test skips.
          submodules: true
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - name: Cache ANTLR4 JAR
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/antlr/antlr4
          key: antlr4-4.13.2
      - name: Install ANTLR4
        run: pip install 'antlr4-tools==0.2.2'
      - name: Generate parser
        run: make grammar
        env:
          ANTLR4_TOOLS_ANTLR_VERSION: '4.13.2'
      - name: Build
        run: make build
      - name: Vet
        # Before Test, which takes ~12 min. gofmt runs in quick-checks; vet
        # needs the generated parser, so it is the first thing after the build.
        run: make vet
      - name: Test
        run: make test
      - name: Check tunnel stays Linux-only
        # The embedded tunnel (chisel) must never reach the Windows/macOS builds —
        # it gets mxcli flagged by Defender and enterprise EDR on managed corporate
        # endpoints, which is most of our audience. See ADR-0009. The script also
        # asserts a positive control (chisel IS in the linux graph) so it cannot
        # pass vacuously.
        run: ./scripts/check-tunnel-deps.sh
      - name: Check MDL example scripts
        # Single source of truth: `make check-mdl` covers BOTH doctype-tests/ and
        # bug-tests/ (skipping *.test.mdl, inverting *.fail.mdl negative tests, and
        # honouring the pre-existing-failure SKIP list). Previously this step only
        # iterated doctype-tests/, so bug-test regression fixtures had no CI gate.
        run: make check-mdl
      - name: Check skill pack JavaScript
        # Nothing else in this repo compiles a pack's widget — it is built in
        # the user's project — so logic shipped there is otherwise ungated. The
        # #574 case: the widget must attach the session's CSRF token to
        # same-origin fetches and never to any other host.
        run: make check-skill-pack-js
      # check-findings, check-wiki-pages, check-skill-index and
      # check-test-timeouts run in quick-checks.
      - name: Check skill MDL blocks
        run: ./scripts/check-skill-mdl.sh ./bin/mxcli .claude/skills/mendix
      - name: Check docs-site MDL blocks
        run: ./scripts/check-skill-mdl.sh ./bin/mxcli docs-site/src
      - name: Check complete MDL examples (skills, docs-site) pass mxcli check
        # The step above fails only on syntax. A whole example that parses and
        # that `mxcli check` still rejects (MDL031, MDL063) shipped as correct
        # until a user ran the pack through check (mendixlabs/mxcli#1357).
        run: ./scripts/check-skill-mdl-semantics.sh ./bin/mxcli .claude/skills/mendix .claude/skills/packs docs/01-project/MDL_QUICK_REFERENCE.md docs-site/src
      - name: Check MDL conformance
        # Every MDL block in `mxcli syntax`, the skills, docs-site, the quick
        # reference and mdl-examples, parsed as mdl 1, with deprecated
        # spellings, mdl 1 refusals and a complete script without the header
        # as failures, against an allowlist that may only shrink
        # (ako/mxcli#756, ako/mxcli#714 decision 1).
        run: make check-conformance
      - name: Check the migration reference is current
        # The tables on docs-site/src/language/versions.md are generated from
        # the language-change and deprecation registries (ako/mxcli#714).
        run: make check-migration-reference
      # The integration tests are the `integration` job below. Lint Go was here:
      # its fmt-check is in quick-checks and its vet runs before Test.
      - name: Vulnerability scan
        # Pinned, not @latest: a new scanner release could otherwise turn every
        # run red, or change what it reports, with no change in this repo. The
        # vulnerability DATABASE is still fetched fresh each run, so new advisories
        # are seen without bumping this; bump the scanner on purpose.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

  # The integration tests, split into suites that run as parallel jobs
  # (ako/mxcli#757). As one `make test-integration` step they took ~22 of its 30
  # minutes once the upgrade property test landed, and the step's wall time was
  # mdl/roundtrip's alone (~21 min) — go test already ran the packages in
  # parallel, so no timeout below 30 min was going to hold as the round trip
  # grows (#743 adds TestApp to it).
  #
  # Measured per package on the ubuntu runner (run 36319810164) and what each
  # suite is expected to take, including ~3 min of checkout/build/mxbuild:
  #   executor   mdl/executor                          ~15.5 min -> ~19 min
  #   roundtrip  mdl/roundtrip, round-trip laws         ~1.7 min -> ~4 min
  #   upgrade    upgrade property test, 3 shards        ~19 min  -> ~10 min each
  #   other      cmd/mxcli{,/docker,/marketplace}       ~5.7 min -> ~8 min
  # The full-corpus upgrade run (MXCLI_UPGRADE_ALL) is nightly, not here.
  #
  # Nothing here is dropped from per-PR CI: the round-trip laws and the
  # execute-both upgrade test run at their default scope, the shards together
  # executing every script exactly once (TestShardsPartition). Only the unit
  # tests of packages WITHOUT integration tests are no longer re-run under the
  # tag — `make test` in build-and-test runs those.
  integration:
    name: integration (${{ matrix.suite }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    needs: quick-checks
    runs-on: ubuntu-latest
    # Each suite's go test has its own -timeout (Makefile); this is the job's
    # backstop, with room for the setup steps.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: executor
            mxbuild: true
          - suite: roundtrip
          - suite: parity
          - suite: upgrade
            shard: 1/3
          - suite: upgrade
            shard: 2/3
          - suite: upgrade
            shard: 3/3
          - suite: other
            mxbuild: true
    steps:
      - uses: actions/checkout@v7
        with:
          # testdata/testapp (ako/TestApp), the round trip's second Studio
          # Pro-authored fixture (#743); only the roundtrip and parity suites read it, and
          # without it that test skips.
          submodules: ${{ matrix.suite == 'roundtrip' || matrix.suite == 'parity' }}
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - name: Cache ANTLR4 JAR
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/antlr/antlr4
          key: antlr4-4.13.2
      - name: Install ANTLR4
        run: pip install 'antlr4-tools==0.2.2'
      - name: Generate parser
        run: make grammar
        env:
          ANTLR4_TOOLS_ANTLR_VERSION: '4.13.2'
      - name: Build
        run: make build
      # mdl/roundtrip runs on the committed PedApp fixture and never calls mx.
      # One engine since the legacy sdk/mpr backend was deleted
      # (docs/plans/2026-09-14-retire-legacy-engine.md), so MXCLI_TEST_ENGINES
      # is left unset.
      - name: Setup mxbuild
        if: matrix.mxbuild
        run: ./bin/mxcli setup mxbuild --version 11.12.2
      - name: Integration tests (${{ matrix.suite }})
        run: make test-integration-${{ matrix.suite }}
        env:
          MXCLI_UPGRADE_SHARD: ${{ matrix.shard }}
        # Below the job's 45: the roundtrip suite reached 29m57s once #863/#864
        # built each declared flow during create or modify (see the issue on
        # that cost); a step timeout is a hang guard, not a budget.
        timeout-minutes: 40

  # One stable check name for "every integration suite passed", whatever the
  # matrix above becomes — a branch rule can require this instead of each leg.
  #
  # `!cancelled()`, not `always()`: it still runs (and fails) when a suite failed
  # or was skipped, so the gate never passes vacuously, but it is skipped when the
  # run is cancelled. `always()` jobs run even then, so a superseded PR run (see
  # `concurrency` above) could not end until this job got a runner — and the
  # concurrency group held the replacement run pending meanwhile: ~5 min on
  # PR #1885 (run 41406249166), at the 20-job cap (ako/mxcli#1886).
  #
  # When quick-checks fails, the integration legs are skipped, and this gate
  # then fails on `integration: skipped` — red, never a vacuous pass.
  integration-passed:
    if: ${{ !cancelled() }}
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - name: All integration suites passed
        run: |
          if [ "${{ needs.integration.result }}" != "success" ]; then
            echo "integration: ${{ needs.integration.result }}"
            exit 1
          fi
