major: 11
supported_range: "11.0.0..11.99.99"

features:
  domain_model:
    entities:
      min_version: "10.0.0"
      mdl: "CREATE PERSISTENT ENTITY Module.Name (...)"
    non_persistent_entities:
      min_version: "10.0.0"
      mdl: "CREATE NON-PERSISTENT ENTITY Module.Name (...)"
    view_entities:
      min_version: "10.21.0"
      mdl: "CREATE VIEW ENTITY Module.Name (...) AS SELECT ..."
      notes: "View entities arrived in 10.18 with their OQL inline; mxcli stores the query in a separate DomainModels$ViewEntitySourceDocument that the entity's OqlViewEntitySource.SourceDocument names, both 10.21.0 (mendixmodelsdk 4.117.0), and the write refuses them below. 10.x also stores the OQL inline. Was 10.18.0 (ako/mxcli#1811)."
    calculated_attributes:
      min_version: "10.0.0"
      mdl: "CALCULATED BY Module.Microflow"
    entity_generalization:
      min_version: "10.0.0"
      mdl: "EXTENDS Module.ParentEntity"
    export_levels:
      min_version: "10.0.0"
      mdl: "EXPORT LEVEL API | HIDDEN on an entity, attribute, association or enumeration"
      notes: "DomainModels Entity/Attribute/AssociationBase.exportLevel and Projects Document.exportLevel (enumerations) introduced in 9.3.0 (mendixmodelsdk 4.116.0 StructureVersionInfo); mendixlabs/mxcli#1498"
    alter_entity:
      min_version: "10.0.0"
      mdl: "ALTER ENTITY Module.Name ADD ATTRIBUTE ..."

  oql_functions:
    basic_select:
      min_version: "10.18.0"
      mdl: "SELECT, FROM, WHERE, AS, AND, OR, NOT"
    aggregate_functions:
      min_version: "10.18.0"
      mdl: "COUNT, SUM, AVG, MIN, MAX, GROUP BY"
    subqueries:
      min_version: "10.18.0"
      mdl: "Inline subqueries in SELECT and WHERE"
    join_types:
      min_version: "10.18.0"
      mdl: "INNER JOIN, LEFT JOIN, RIGHT JOIN, FULL JOIN"
    string_agg:
      # STRING_AGG(expression, 'separator'), the OQL aggregate that joins a
      # group's values into one string. mxbuild 11.0.0 and 11.1.0 have no
      # 'STRING_AGG' token in their OQL lexer and mx check reports every such
      # view as CE0174 "Unknown function 'string_agg'"; 11.2.0 has it. The
      # 10.24 line got it separately, in 10.24.22 (ako/mxcli#1650).
      min_version: "11.2.0"
      mdl: "STRING_AGG(expression, 'separator') in a view entity's OQL query"
      notes: "Measured with mx check: 11.0.0 and 11.1.0 CE0174 \"Unknown function 'string_agg'\"; 11.2.0, 11.6.6, 11.6.8, 11.6.12, 11.7.0, 11.8.0, 11.9.1, 11.10.0, 11.12.2, 11.13.0 and 11.15.0 build it. The column's type changed in 11.7.0: before, the type of its argument (String(100) over a String(100)); from 11.7.0, String(200) whatever it aggregates. ako/mxcli#1650"
    comments:
      min_version: "11.7.0"
      mdl: "-- line comment / /* block comment */ in a view entity's OQL query"
      notes: "Measured, not taken from release notes (they agree: OQL comments are listed as introduced in 11.7.0). The same view entities, each with one comment between clauses, at the end of a line or as a block: mx check 10.24.25 and 11.6.6 report CE0174 \"Error(s) in OQL query: The '-' part is incomplete or incorrect\" on every one, with the comment-free control at 0 errors; 11.7.0 and 11.13.0 report 0 errors. UseOQLVersion2 was true on all four, so the setting is not the discriminator. ako/mxcli#1632"

  microflows:
    basic:
      min_version: "10.0.0"
      mdl: "CREATE MICROFLOW Module.Name (...) BEGIN ... END"
    deep_link_url:
      min_version: "11.0.0"
      mdl: "URL 'item/{Key}' / URL SEARCH PARAMETERS ($Filter) / DROP URL"
      notes: "Microflow deep links (10.6+, so available throughout 11.x)."
    synchronize:
      min_version: "10.0.0"
      mdl: "SYNCHRONIZE ALL | $Var[, $Var...]  (nanoflow only)"
    synchronize_unsynchronized:
      min_version: "10.0.0"
      mdl: "SYNCHRONIZE UNSYNCHRONIZED  (nanoflow only)"
    send_email:
      min_version: "11.13.0"
      mdl: "SEND EMAIL FROM … TO … SUBJECT … HOST … PORT …  (microflow only)"
      notes: "Built-in Send Email activity (Microflows$SendEmailAction, beta). The metamodel type dates from 11.2.0, but its subject and bodies became StringTemplates in 11.12.0 and the plain Subject/MessageBody expressions were deleted in 11.13.0 (mendixmodelsdk StructureVersionInfo); 11.13.0 is also the release that put the activity in the toolbox."
    show_page_with_params:
      min_version: "11.0.0"
      mdl: "SHOW PAGE Module.PageName WITH PARAMS ..."
    send_rest_request:
      min_version: "10.1.0"
      mdl: "SEND REST REQUEST ..."
      notes: "Microflows$RestOperationCallAction introduced in 10.1.0 (mendixmodelsdk 4.117.0). mx 9.24.30 loads the action (CE7053 \"No REST operation specified\", not a load failure), but the consumed REST service it calls, Rest$ConsumedRestService, is 10.1 as well, so a 9.24 author cannot set one up. check -p names the statement before the write refuses it (ako/mxcli#1811)."
    send_rest_query_params:
      min_version: "11.0.0"
      mdl: "SEND REST REQUEST with query parameters"
    execute_database_query:
      min_version: "9.24.0"
      mdl: "EXECUTE DATABASE QUERY ..."
      notes: "DatabaseConnector$ExecuteDatabaseQueryAction and QueryParameterMapping introduced in 9.24.0 (mendixmodelsdk 4.117.0); mx 9.24.30 loads the action (CE1613 for a query that does not exist, not a load failure). Was 10.6.0, a floor nothing measured (ako/mxcli#1811)."
    execute_database_query_runtime_connection:
      min_version: "11.1.0"
      mdl: "EXECUTE DATABASE QUERY with runtime connection override"
      notes: "DatabaseConnector$ConnectionParameterMapping and ExecuteDatabaseQueryAction.ConnectionParameterMappings introduced in 11.1.0 (mendixmodelsdk 4.117.0). Was 11.0.0 (ako/mxcli#1811)."
    loop_in_branch:
      min_version: "10.0.0"
      notes: "LOOP inside IF/ELSE branches"
    list_find_filter_by_expression:
      min_version: "9.0.3"
      mdl: "$Found = FIND $List WHERE expression; $Kept = FILTER $List WHERE expression;"
      notes: "Microflows$FindByExpression and FilterByExpression introduced in 9.0.3 (mendixmodelsdk 4.117.0); `BY Member = value` writes Microflows$Find/Filter, which every version has. The write refuses each type below it (canon.UndeclaredTypeError); check -p names the statement first (ako/mxcli#1811)."
    send_external_object:
      min_version: "9.6.0"
      mdl: "SEND EXTERNAL OBJECT $Obj [REFRESH];"
      notes: "Microflows$SendExternalObject introduced in 9.6.0 (mendixmodelsdk; ako/mxcli#1939)."
    delete_external_object:
      min_version: "9.12.0"
      mdl: "DELETE EXTERNAL OBJECT $Obj [REFRESH];"
      notes: "Microflows$DeleteExternalObject introduced in 9.12.0 (mendixmodelsdk; ako/mxcli#1939)."
    call_external_action:
      min_version: "9.19.0"
      mdl: "CALL EXTERNAL ACTION Module.Service.Action ();"
      notes: "Microflows$CallExternalAction introduced in 9.19.0 (mendixmodelsdk 4.117.0; ako/mxcli#1811)."
    list_range:
      min_version: "9.24.0"
      mdl: "$Page = RANGE $List OFFSET $Offset LIMIT $Amount;"
      notes: "Microflows$ListRange introduced in 9.24.0 (mendixmodelsdk 4.117.0; ako/mxcli#1811)."
    send_rest_request_parameters:
      min_version: "10.2.0"
      mdl: "SEND REST REQUEST Module.Service.Operation WITH (Id = $Order/Id);"
      notes: "Microflows$RestOperationParameterMapping introduced in 10.2.0 (mendixmodelsdk 4.117.0). Below 11.0 an operation has only path parameters (Rest$QueryParameter is 11.0), so every argument is one (ako/mxcli#1811)."
    call_external_action_arguments:
      min_version: "10.2.0"
      mdl: "CALL EXTERNAL ACTION Module.Service.Action (Name = $Value);"
      notes: "Microflows$ExternalActionParameterMapping introduced in 10.2.0 (mendixmodelsdk 4.117.0); an action called with no arguments writes none (ako/mxcli#1811)."
    send_rest_request_output:
      min_version: "10.4.0"
      mdl: "$Response = SEND REST REQUEST Module.Service.Operation;"
      notes: "Microflows$OutputVariable introduced in 10.4.0 (mendixmodelsdk 4.117.0; ako/mxcli#1811)."
    send_rest_request_body:
      min_version: "10.5.0"
      mdl: "SEND REST REQUEST Module.Service.Operation BODY $Order;"
      notes: "Microflows$BodyVariable introduced in 10.5.0 (mendixmodelsdk 4.117.0). Written for an operation whose body is an export mapping; the clause is gated as written (ako/mxcli#1811)."
    transform_json:
      min_version: "11.4.0"
      mdl: "$Out = TRANSFORM $Json WITH Module.Transformer;"
      notes: "Microflows$TransformJsonAction introduced in 11.4.0 (mendixmodelsdk 4.117.0; ako/mxcli#1811)."
    loop_over_list:
      min_version: "9.0.4"
      mdl: "LOOP $Item IN $List BEGIN … END LOOP;"
      notes: "Microflows$IterableList and LoopedActivity.LoopSource introduced in 9.0.4 (mendixmodelsdk 4.117.0); before, a loop stored its list on the activity itself, which mxcli does not write. The write refuses the loop below it; check -p names the statement first (ako/mxcli#1811)."
    while_loop:
      min_version: "9.0.4"
      mdl: "WHILE condition BEGIN … END WHILE;"
      notes: "Microflows$WhileLoopCondition introduced in 9.0.4 (mendixmodelsdk 4.117.0; ako/mxcli#1811)."
    queued_calls:
      min_version: "9.10.0"
      mdl: "CALL MICROFLOW Module.Flow() IN QUEUE Module.Queue; CALL JAVA ACTION Module.Action() IN QUEUE Module.Queue;"
      notes: "Queues$QueueSettings and the calls' QueueSettings introduced in 9.10.0 (mendixmodelsdk 4.117.0; ako/mxcli#1811)."

  pages:
    basic:
      min_version: "10.0.0"
      mdl: "CREATE PAGE Module.Name (...) { ... }"
    page_parameters:
      min_version: "11.0.0"
      mdl: "CREATE PAGE Module.Name (Param: Type, ...) { ... }"
    page_parameter_optional:
      # Studio Pro's "Required" checkbox on a page parameter, unticked:
      # Forms$PageParameter.IsRequired = false. The property is introduced in
      # 11.5.0 (modelsdk/gen/pages/version.go, from the reflection data); below
      # it every page parameter is required (mendixlabs/mxcli#1640).
      min_version: "11.5.0"
      mdl: "CREATE PAGE Module.Name (Params: ( $P: Module.Entity optional )) { ... }"
    page_variables:
      min_version: "11.0.0"
    flow_call_output_mappings:
      # Studio Pro's "Return value mappings" on a call microflow / call
      # nanoflow action: Forms$MicroflowSettings.OutputMappings and
      # Forms$CallNanoflowClientAction.OutputMappings are introduced in 11.5.0
      # (modelsdk/gen/pages/version.go, from the reflection data).
      min_version: "11.5.0"
      mdl: "call microflow M.F returns ($var = $ActionReturnValue)"
    flow_call_output_mappings_to_attribute:
      # A return value mapping whose target is an attribute of the data
      # container's object. Measured, not from the metamodel (the property set
      # is the same from 11.5): the identical bytes check clean on mx
      # 11.15.0-rc.4 and fail CE7006 "Selected value is not valid for
      # attribute" on mx 11.13.0 and 11.14.0, before and after `mx convert`.
      # A page-variable target checks clean on all three (ako/mxcli#977).
      min_version: "11.15.0"
      mdl: "call microflow M.F returns (Attr = $ActionReturnValue/Attr)"
    pluggable_widgets:
      min_version: "10.0.0"
      notes: "Widget templates are currently extracted from 11.6; may cause CE0463 on 10.x"
    conditional_visibility:
      min_version: "10.0.0"
      mdl: "Visible: [$currentObject/Attribute != empty]"
      notes: "ConditionalVisibilitySettings BSON; MDL syntax available from 11.0+"
    conditional_editability:
      min_version: "10.0.0"
      mdl: "Editable: [expression]"
      notes: "ConditionalEditabilitySettings BSON; MDL syntax available from 11.0+"
    responsive_column_widths:
      min_version: "10.0.0"
      mdl: "TabletWidth: 6, PhoneWidth: 12"
      notes: "BSON fields exist in 10.x; MDL syntax available from 11.0+"
    design_properties_v3:
      min_version: "11.0.0"
      notes: "Atlas v3 design properties (Card style, Disable row wrap)"
    alter_page:
      min_version: "10.0.0"
      mdl: "ALTER PAGE Module.Name SET/INSERT/DROP/REPLACE ..."
    workflow_page_actions:
      min_version: "9.0.2"
      mdl: "action: open user task | open workflow | call workflow Module.WF"
      notes: "Forms$OpenUserTaskClientAction, OpenWorkflowClientAction and CallWorkflowClientAction introduced in 9.0.2 with workflows (mendixmodelsdk 4.117.0; ako/mxcli#1811)."
    complete_task_action:
      min_version: "9.19.0"
      mdl: "action: complete task 'Outcome'"
      notes: "Forms$SetTaskOutcomeClientAction is 9.0.2, but the OutcomeValue mxcli writes is 9.19.0 (mendixmodelsdk 4.117.0); below, the write refuses the page (ako/mxcli#1811)."
    snippet_parameters:
      min_version: "9.21.0"
      mdl: "CREATE SNIPPET Module.Name (Params: ($P: Module.Entity)) { … }"
      notes: "Forms$SnippetParameter and Snippet.Parameters introduced in 9.21.0 (mendixmodelsdk 4.117.0). A snippet call writes a mapping only for a parameter the called snippet declares, so it cannot reach an older project (ako/mxcli#1811)."

  security:
    module_roles:
      min_version: "10.0.0"
    user_roles:
      min_version: "10.0.0"
    entity_access:
      min_version: "10.0.0"
    demo_users:
      min_version: "10.0.0"

  integration:
    rest_client_basic:
      min_version: "10.1.0"
      mdl: "CREATE REST CLIENT Module.Name ..."
    rest_client_query_params:
      min_version: "11.0.0"
      mdl: "CREATE REST CLIENT with query parameters"
    rest_client_headers:
      min_version: "10.4.0"
    published_rest_service:
      min_version: "10.0.0"
      mdl: "CREATE PUBLISHED REST SERVICE Module.Name ..."
    published_rest_grant_revoke:
      min_version: "10.0.0"
      mdl: "GRANT/REVOKE ACCESS ON PUBLISHED REST SERVICE ..."
    published_rest_alter:
      min_version: "10.0.0"
      mdl: "ALTER PUBLISHED REST SERVICE Module.Name ..."
    data_transformer:
      min_version: "11.9.0"
      mdl: "CREATE DATA TRANSFORMER Module.Name SOURCE JSON '...' { JSLT '...'; }"
    database_connector_basic:
      min_version: "10.0.0"
      mdl: "CREATE DATABASE CONNECTION Module.Name ..."
      notes: "DatabaseConnector$DatabaseConnection is 9.22.0, but the ConnectionInput (a DatabaseConnector$ConnectionString) mxcli writes is 10.0.0 (mendixmodelsdk 4.117.0); below, the write refuses the connection. Was 10.6.0, a floor nothing measured (ako/mxcli#1811)."
    database_connector_execute:
      min_version: "9.24.0"
      mdl: "EXECUTE DATABASE QUERY in microflows"
      notes: "The action microflows.execute_database_query gates: 9.24.0 (ako/mxcli#1811)."
    business_events:
      min_version: "9.24.0"
      mdl: "CREATE BUSINESS EVENT SERVICE Module.Name ..."
      notes: "BusinessEvents$BusinessEventService and its children introduced in 9.24.0 (mendixmodelsdk 4.117.0). mx 9.24.30 loads a service mxcli writes; its errors there are the content (the Business Events module, an attribute's length). Was 10.0.0 (ako/mxcli#1811)."
    odata_client:
      min_version: "10.0.0"
    published_odata_service:
      # ODataPublish$PublishedODataService2 is 10.4+; see mendix-10.yaml.
      min_version: "10.4.0"
      mdl: "CREATE PUBLISHED ODATA SERVICE Module.Name (...) { PUBLISH ENTITY ... }"
    odata_graphql:
      # A published OData service can also answer GraphQL — one boolean, same
      # resources, an extra endpoint. Introduced in Studio Pro 10.14 as an
      # EXPERIMENTAL feature: "Studio Pro now supports publishing GraphQL
      # services. When you enable this setting, you can specify that a published
      # OData service supports GraphQL, resulting in a service that supports both
      # OData and GraphQL." (release notes, 10.14)
      #
      # The floor is documentary, not measured: the Mendix CDN no longer serves
      # any 10.x mxbuild from here, so the earliest assembly available to check
      # is 11.x. It matters because writing a property a version does not have
      # is what makes Studio Pro refuse to open the document, so the gate is a
      # real guard rather than a nicety.
      min_version: "10.14.0"
      mdl: "CREATE ODATA SERVICE Module.Name (SupportsGraphQL: Yes) ..."
    message_definition_collection:
      # Message definitions as entries of a MessageDefinitionCollection. Mendix
      # 11.15 removed the collection: `mx convert` turns one into a folder of the
      # same name holding one MessageDefinition2 document per entry, and a
      # mapping's source moves from MessageDefinition (Module.Collection.Name)
      # to MessageDefinition2 (Module.Name). Measured with mxbuild 11.15.0
      # (ako/mxcli#987).
      min_version: "10.0.0"
      max_version: "11.14.99"
      mdl: "CREATE MESSAGE DEFINITION COLLECTION Module.Name { DEFINITION ... }"
    message_definition_document:
      # One MessageDefinitions$MessageDefinition2 document per message
      # definition, the 11.15 replacement for the collection (ako/mxcli#987).
      min_version: "11.15.0"
      mdl: "CREATE MESSAGE DEFINITION Module.Name FOR Module.Entity { ... }"
    rest_client_authentication:
      min_version: "10.2.0"
      mdl: "authentication: basic (username: '…', password: '…')"
      notes: "Rest$BasicAuthenticationScheme and ConsumedRestService.AuthenticationScheme introduced in 10.2.0 (mendixmodelsdk 4.117.0; ako/mxcli#1811)."
    rest_client_operations:
      min_version: "10.4.0"
      mdl: "OPERATION Name ( method: get, path: '…', response: … )"
      notes: "Rest$RestOperation.Method (RestOperationMethodWithBody / WithoutBody) is 10.4.0 and ResponseHandling 10.3.0 (mendixmodelsdk 4.117.0); every operation mxcli writes holds both, so a consumed REST service with an operation needs 10.4 (ako/mxcli#1811)."
    rest_client_openapi:
      min_version: "10.21.0"
      mdl: "CREATE CONSUMED REST SERVICE Module.Name ( OpenAPI: '…' )"
      notes: "Rest$OpenApiFile and ConsumedRestService.OpenApiFile introduced in 10.21.0 (mendixmodelsdk 4.117.0; ako/mxcli#1811)."
    database_connector_queries:
      min_version: "10.12.0"
      mdl: "CREATE DATABASE CONNECTION Module.Name ( … ) { QUERY Name ( Sql: '…' ) }"
      notes: "DatabaseConnector$DatabaseQuery is 9.22.0, but its QueryType, which mxcli writes for every query, and TableMappings are 10.12.0 (mendixmodelsdk 4.117.0); measured on stamped projects, the write refuses a connection with a query below 10.12 (ako/mxcli#1811)."

  agent_documents:
    # Agent Editor documents (Model, Knowledge Base, Consumed MCP Service,
    # Agent). Studio Pro's agent editor is an extension and the documents are
    # stored as custom blobs, so mxbuild validates nothing about them -- these
    # entries are the only version gate mxcli has.
    agent_model:
      min_version: "11.9.0"
      mdl: "CREATE MODEL Module.Name (Provider: ..., Key: Module.ApiKey)"
    agent_knowledge_base:
      min_version: "11.9.0"
      mdl: "CREATE KNOWLEDGE BASE Module.Name (Provider: ..., Key: Module.KBKey)"
    agent_consumed_mcp_service:
      min_version: "11.9.0"
      mdl: "CREATE CONSUMED MCP SERVICE Module.Name (ProtocolVersion: ...)"
    agent:
      min_version: "11.9.0"
      mdl: "CREATE AGENT Module.Name (UsageType: Task|Chat, Model: ..., SystemPrompt: '...')"

  workflows:
    basic:
      min_version: "9.0.2"
      mdl: "CREATE WORKFLOW Module.Name ..."
      notes: "Workflows$Workflow introduced in 9.0.2 (mendixmodelsdk 4.117.0); the CDN lists mxbuild 9.0.0 and 9.0.1, which have no workflows. The write refuses the type below it (canon.UndeclaredTypeError); create workflow, create or modify workflow and alter workflow are refused by check -p first (ako/mxcli#1809)."
    groups:
      min_version: "11.2.0"
      mdl: "ALTER SETTINGS WORKFLOWS ADD [OR MODIFY] GROUP 'Approvers' (Description: '...')"
      notes: "Settings$WorkflowGroup and WorkflowsProjectSettingsPart.groups were both introduced in 11.2.0 (mendixmodelsdk 4.115.0 StructureVersionInfo). Mendix's release notes call the feature GA in 11.6; the metamodel floor is what decides whether the document loads. Corroborated against real projects: a blank 11.13.0 app's workflows settings part carries `Groups: [2]`, an 11.1.0 one has no Groups key at all — so writing the property below the floor would be inventing a key, the mendixlabs/mxcli#759 failure shape."
    parallel_split:
      min_version: "9.0.0"
    user_task:
      min_version: "9.19.0"
      notes: "Workflows$UserTask is 9.0.2, but the outcome value (Workflows$UserTaskOutcome.Value) mxcli writes is 9.19.0, its task page 9.11.0 and its on-created event 9.0.5 (mendixmodelsdk 4.117.0). Measured on stamped 9.x projects: the write refuses a user task below 9.19 (ako/mxcli#1811)."
    multi_user_task:
      min_version: "9.22.0"
      mdl: "MULTI USER TASK Vote 'Vote' PAGE M.TaskPage OUTCOMES 'Yes' { } 'No' { };"
      notes: "Before 10.12 a Workflows$UserTask whose UserTaskCompletion is a MultiInputCompletion, introduced with consensus and veto in 9.22.0 (mendixmodelsdk 4.117.0; ako/mxcli#1771)."
    multi_user_task_majority_threshold:
      min_version: "10.0.0"
      mdl: "MULTI USER TASK … DECIDE BY MAJORITY MORE THAN HALF | DECIDE BY THRESHOLD 60 PERCENT"
      notes: "MajorityCompletionCriteria and ThresholdCompletionCriteria introduced in 10.0.0 (mendixmodelsdk 4.117.0; ako/mxcli#1771)."
    multi_user_task_await_all:
      min_version: "10.2.0"
      mdl: "MULTI USER TASK … AWAIT ALL USERS"
      notes: "MultiInputCompletion.awaitAllUsers introduced in 10.2.0, on MultiUserTaskActivity from 10.12 (mendixmodelsdk 4.117.0; ako/mxcli#1771)."
    multi_user_task_microflow_rule:
      min_version: "10.3.0"
      mdl: "MULTI USER TASK … DECIDE BY MICROFLOW M.Decide"
      notes: "MicroflowCompletionCriteria introduced in 10.3.0 (mendixmodelsdk 4.117.0; ako/mxcli#1771)."
    group_targeting:
      min_version: "11.2.0"
      mdl: "USER TASK … TARGETING GROUPS XPATH [Name = 'Reviewers'] | TARGETING GROUPS MICROFLOW M.Groups"
      notes: "XPathGroupTargeting and MicroflowGroupTargeting introduced in 11.2.0 with UserTaskActivity.userTargeting (mendixmodelsdk 4.117.0). Before 11.2 a user task's UserSource targets users only (ako/mxcli#1771)."
    ai_agent_task:
      min_version: "11.9.0"
      mdl: "CALL AGENT MICROFLOW Module.InvokeAgent WITH (Param = '$WorkflowContext')"
      notes: "Workflows$AIAgentTaskActivity, introduced when Mendix 11.9 split MicroflowBasedActivity into CallMicroflowActivity + AIAgentTaskActivity. Absent from the 11.6 mxbuild, present from 11.10."
    wait_for_notification:
      min_version: "10.0.0"
      mdl: "WAIT FOR NOTIFICATION Name;"
      notes: "Workflows$WaitForNotificationActivity introduced in 10.0.0 (mendixmodelsdk 4.117.0, the type's versionInfo). The write refuses the type below it (canon.UndeclaredTypeError, ako/mxcli#1774)."
    wait_for_timer:
      min_version: "10.6.0"
      mdl: "WAIT FOR TIMER Name addHours([%CurrentDateTime%], 1);"
      notes: "Workflows$WaitForTimerActivity introduced in 10.6.0 (mendixmodelsdk 4.117.0; ako/mxcli#1774)."
    timer_boundary_event:
      min_version: "10.14.0"
      mdl: "BOUNDARY EVENT TIMER addDays([%CurrentDateTime%], 1) { … }"
      notes: "Workflows$TimerBoundaryEvent and the boundaryEvents of an activity introduced in 10.14.0 (mendixmodelsdk 4.117.0; ako/mxcli#1774). From 11.0 the bare form is MDL-WF07: no 11.x runtime has the class."
    interrupting_timer_boundary_event:
      min_version: "10.20.0"
      mdl: "BOUNDARY EVENT [NON] INTERRUPTING TIMER addDays([%CurrentDateTime%], 1) { … }"
      notes: "Workflows$InterruptingTimerBoundaryEvent and NonInterruptingTimerBoundaryEvent introduced in 10.20.0; 10.14–10.19 store a Workflows$TimerBoundaryEvent (mendixmodelsdk 4.117.0; ako/mxcli#1774)."
    workflow_definition_selection:
      min_version: "10.0.0"
      mdl: "LOCK WORKFLOW Module.Workflow; UNLOCK WORKFLOW $Workflow;"
      notes: "Lock/UnlockWorkflowAction.workflowSelection and the Workflows$WorkflowDefinition(Name|Object)Selection it holds introduced in 10.0.0; 9.21–9.24 store the workflow as the action's own Workflow (mendixmodelsdk 4.117.0; ako/mxcli#1774)."
    workflow_microflow_actions:
      min_version: "9.0.2"
      mdl: "CALL WORKFLOW Module.WF ($Ctx); SET TASK OUTCOME $Task 'Approve'; OPEN USER TASK $Task; OPEN WORKFLOW $Wf;"
      notes: "Microflows$WorkflowCallAction, SetTaskOutcomeAction, OpenUserTaskAction and OpenWorkflowAction introduced in 9.0.2 with workflows (mendixmodelsdk 4.117.0). The write refuses each type below it (canon.UndeclaredTypeError); check -p names the statement first (ako/mxcli#1787)."
    workflow_operations:
      min_version: "9.2.0"
      mdl: "WORKFLOW OPERATION ABORT $Wf REASON '…'; WORKFLOW OPERATION RESTART $Wf;"
      notes: "Microflows$WorkflowOperationAction, AbortOperation and RestartOperation introduced in 9.2.0 (mendixmodelsdk 4.117.0; ako/mxcli#1787)."
    workflow_operation_pause_continue:
      min_version: "9.3.0"
      mdl: "WORKFLOW OPERATION PAUSE $Wf; WORKFLOW OPERATION CONTINUE $Wf;"
      notes: "Microflows$PauseOperation and ContinueOperation introduced in 9.3.0 (mendixmodelsdk 4.117.0; ako/mxcli#1787)."
    get_workflow_data:
      min_version: "9.10.0"
      mdl: "$Data = GET WORKFLOW DATA $Wf AS Module.WF;"
      notes: "Microflows$GetWorkflowDataAction introduced in 9.10.0 (mendixmodelsdk 4.117.0; ako/mxcli#1787)."
    workflow_operation_retry_unpause:
      min_version: "9.12.0"
      mdl: "WORKFLOW OPERATION RETRY $Wf; WORKFLOW OPERATION UNPAUSE $Wf;"
      notes: "Microflows$RetryOperation and UnpauseOperation introduced in 9.12.0, replacing ResumeOperation (9.3.0 to 9.11; mendixmodelsdk 4.117.0; ako/mxcli#1787)."
    notify_workflow:
      min_version: "10.0.0"
      mdl: "$Notified = NOTIFY WORKFLOW $Wf TARGET Module.WF.WaitForApproval;"
      notes: "Microflows$NotifyWorkflowAction introduced in 10.0.0, with the wait for notification it resumes (mendixmodelsdk 4.117.0); absent from the 9.24.30 mxbuild (ako/mxcli#1787)."
    get_workflows:
      min_version: "10.4.0"
      mdl: "$Workflows = GET WORKFLOWS FOR $Ctx;"
      notes: "Microflows$GetWorkflowsAction introduced in 10.4.0 (mendixmodelsdk 4.117.0); absent from the 9.24.30 mxbuild (ako/mxcli#1787)."
    get_workflow_activity_records:
      min_version: "10.4.0"
      mdl: "$Records = GET WORKFLOW ACTIVITY RECORDS $Wf;"
      notes: "Microflows$GetWorkflowActivityRecordsAction introduced in 10.4.0 (mendixmodelsdk 4.117.0); absent from the 9.24.30 mxbuild (ako/mxcli#1787)."
    event_handlers:
      min_version: "10.7.0"
      mdl: "CREATE WORKFLOW … ON WORKFLOW EVENTS (…) MICROFLOW Module.Handler AS '…'"
      notes: "Workflow.onWorkflowEvent introduced in 10.7.0 (modelsdk gen). `ON ANY WORKFLOW EVENT` expands to the measured per-version type list and needs 11.6.0+."
    event_subprocesses:
      min_version: "11.8.0"
      mdl: "EVENT SUBPROCESS ESP_Cancel ON INTERRUPTING NOTIFICATION espCancelStart { … };"
      notes: "Workflow.eventSubProcesses introduced in 11.8.0 (modelsdk gen). Notification starts measured to load on the 11.10, 11.11, 11.12 and 11.13 mxbuilds."
    timer_event_subprocesses:
      min_version: "11.13.0"
      mdl: "EVENT SUBPROCESS ESP_Remind ON NON INTERRUPTING TIMER 'addDays([%CurrentDateTime%], 1)' { … };"
      notes: "(Non)InterruptingTimerEventSubProcessStartActivity: TypeCacheUnknownTypeException on the 11.10, 11.11 and 11.12 mxbuilds, loads on 11.13."
    recurring_timer_event_subprocesses:
      min_version: "11.15.0"
      mdl: "EVENT SUBPROCESS ESP_Remind ON NON INTERRUPTING TIMER addDays([%CurrentDateTime%], 1) REPEAT EVERY 1 DAY AT MOST 5 TIMES { … };"
      notes: "NonInterruptingTimerEventSubProcessStartActivity.recurrence (ako/mxcli#1716). The 11.13 runtime model has no recurrence on the start (com.mendix.workflows-metamodel.jar) and fires it once — mx check passes; the 11.15 runtime has it. 11.14 unmeasured. A non-interrupting timer BOUNDARY event's recurrence is in the 11.12, 11.13 and 11.15 runtimes."
    notification_events:
      min_version: "11.11.0"
      mdl: "NOTIFICATION Received; … BOUNDARY EVENT INTERRUPTING NOTIFICATION Withdrawn { … }"
      notes: "Workflows$NotificationActivity and (Non)InterruptingNotificationBoundaryEvent: TypeCacheUnknownTypeException on the 11.10 mxbuild, load on 11.11, 11.12 and 11.13."
    notify_target:
      min_version: "11.7.0"
      mdl: "$Notified = NOTIFY WORKFLOW $Workflow TARGET Module.Workflow.espCancelStart;"
      notes: "NotifyWorkflowAction.notifyTarget introduced in 11.7.0 (modelsdk gen), replacing Activity. Not a refusal: before 11.7 mxcli writes the Activity form. A notify with no target is CE0166 on 11.6, 11.10 and 11.13."
    jump_to:
      min_version: "9.0.5"
      mdl: "JUMP TO Activity;"
      notes: "Workflows$JumpToActivity introduced in 9.0.5 (mendixmodelsdk 4.117.0; ako/mxcli#1811)."
    call_workflow_activity:
      min_version: "9.6.0"
      mdl: "CALL WORKFLOW Module.WF;  (an activity of a workflow)"
      notes: "Workflows$CallWorkflowActivity is 9.0.2, but the ParameterExpression mxcli writes is 9.6.0 (mendixmodelsdk 4.117.0; ako/mxcli#1811)."
    overview_page:
      min_version: "9.11.0"
      mdl: "OVERVIEW PAGE Module.Page"
      notes: "Workflow.AdminPage, a Workflows$PageReference, introduced in 9.11.0 (mendixmodelsdk 4.117.0); before, the property was OverviewPage, which mxcli does not write (ako/mxcli#1811)."
    annotations:
      min_version: "9.15.0"
      mdl: "ANNOTATION '…' (on a workflow or an activity)"
      notes: "Workflows$Annotation and Workflow.Annotation introduced in 9.15.0 (mendixmodelsdk 4.117.0; ako/mxcli#1811)."
    workflow_parameter:
      min_version: "9.18.0"
      mdl: "PARAMETER $WorkflowContext: Module.Entity"
      notes: "Workflows$Parameter is 9.6.0, its Entity 9.10.0 and its Name 9.18.0 (mendixmodelsdk 4.117.0); mxcli writes all three. Measured on stamped 9.x projects: below 9.18 the write refuses every workflow with a parameter (ako/mxcli#1811)."
    call_workflow_parameter_mappings:
      min_version: "9.18.0"
      mdl: "CALL WORKFLOW Module.WF (WorkflowContext = $Expr);  (an activity of a workflow)"
      notes: "Workflows$WorkflowCallParameterMapping and CallWorkflowActivity.ParameterMappings introduced in 9.18.0 (mendixmodelsdk 4.117.0; ako/mxcli#1811)."
    interrupting_notification_event_subprocess:
      min_version: "11.10.0"
      mdl: "EVENT SUBPROCESS Name ON INTERRUPTING NOTIFICATION { … };"
      notes: "Workflows$InterruptingNotificationEventSubProcessStartActivity introduced in 11.10.0 (mendixmodelsdk 4.117.0); the non-interrupting start is 11.8 with event sub-processes themselves (ako/mxcli#1811)."

  navigation:
    profiles:
      min_version: "10.0.0"
    menu_items:
      min_version: "10.0.0"
    home_pages:
      min_version: "10.0.0"
    progressive_web_app:
      min_version: "9.0.3"
      mdl: "CREATE OR MODIFY NAVIGATION Profile PROGRESSIVE WEB APP ( Precaching: true )"
      notes: "Navigation$ProgressiveWebAppSettings introduced in 9.0.3 (mendixmodelsdk 4.117.0); `progressive web app off` writes none (ako/mxcli#1811)."
    native_home_page:
      min_version: "9.4.0"
      mdl: "CREATE OR MODIFY NAVIGATION NativePhone HOME PAGE Module.Page"
      notes: "Navigation$NativeHomePage and NativeNavigationProfile.NativeHomePage introduced in 9.4.0 (mendixmodelsdk 4.117.0); the native profile itself is older (ako/mxcli#1811)."
    menu_item_icons:
      min_version: "9.20.0"
      mdl: "MENU ITEM 'Home' ( OnClick: …, Icon: Module.Collection.icon )"
      notes: "Forms$IconCollectionIcon introduced in 9.20.0 with icon collections (mendixmodelsdk 4.117.0); `Icon:` names an icon collection entry and nothing else (ako/mxcli#1811)."
    not_found_page:
      min_version: "10.13.0"
      mdl: "NOT FOUND PAGE Module.Page"
      notes: "Navigation$NotFoundHomePage and NavigationProfile.NotFoundHomepage introduced in 10.13.0 (mendixmodelsdk 4.117.0; ako/mxcli#1811)."

  mpr_format:
    mpr_v2:
      min_version: "10.18.0"
      notes: "MPR metadata + mprcontents/ folder with individual documents"
    association_storage:
      min_version: "11.0.0"
      notes: "New association storage format"
    portable_app:
      min_version: "11.6.0"
      notes: "New portable app deployment format"

  modules:
    jar_dependencies:
      min_version: "10.0.0"
      mdl: "ALTER MODULE Module ADD JAR DEPENDENCY (group = '…', artifact = '…', version = '…')"
      notes: "Projects$JarDependency and ModuleSettings.JarDependencies introduced in 10.0.0 (mendixmodelsdk 4.117.0; ako/mxcli#1811)."
    jar_dependency_exclusions:
      min_version: "10.12.0"
      mdl: "ALTER MODULE Module SET JAR DEPENDENCY 'group:artifact' ADD EXCLUSION '…'"
      notes: "Projects$JarDependencyExclusion introduced in 10.12.0 (mendixmodelsdk 4.117.0; ako/mxcli#1811)."
    module_type:
      min_version: "9.12.0"
      mdl: "CREATE MODULE M ( ModuleType: addon ) / ALTER MODULE M SET ( ModuleType: addon )"
      notes: "An add-on module is ModuleSettings.ExportLevel = Protected with ProtectedModuleType = AddOn; ProtectedModuleType introduced in 9.12.0 (mendixmodelsdk 4.117.0; ako/mxcli#1921)."

  scheduled_events:
    schedules:
      min_version: "9.12.0"
      mdl: "CREATE SCHEDULED EVENT Module.Name ( Microflow: …, Repeat: Daily, … )"
      notes: "ScheduledEvents$MinuteSchedule … YearWeekdaySchedule, ScheduledEvent.Schedule and OnOverlap introduced in 9.12.0 (mendixmodelsdk 4.117.0); before, an event has only an interval, which mxcli does not write (ako/mxcli#1811)."
