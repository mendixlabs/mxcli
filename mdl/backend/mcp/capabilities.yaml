# PED (Studio Pro MCP server) authoring capabilities — the table half of the
# capability model (ADR-0006). This file holds ONLY what a live probe cannot
# answer: which features mxcli can author, and why the rest are blocked (PED's
# create whitelist, behavioural quirks).
#
# Tool *presence* is NOT here and must never be added. Presence comes from the
# live tools/list probe, because it varies with the user's Studio Pro preferences
# (a togglable tool like oql_generate) and with the MCP servers they have
# connected to Studio Pro — neither of which any version table can model.
# See ADR-0006's Revision (2026-08-11).
#
# Fields:
#   key                    stable machine id the backend gates on (canAuthor(key));
#                          the constants in capabilities.go must match these.
#   available              authorable at baseline (Studio Pro 11.11 / the first MCP
#                          server). True means BOTH PED permits it AND mxcli has a
#                          create path — never flip it for one without the other.
#   available_since_mendix the PROJECT's Mendix version from which it is authorable
#                          ("11.12"). Keyed on the project version because MCP
#                          serverInfo.version is frozen at 1.0.0 across 11.11-11.14
#                          and cannot discriminate releases (11.15 reports its own
#                          version, but earlier ones never will).
#   requires_tools         Studio Pro tools the feature needs. WHICH tools a feature
#                          depends on is not observable, so it belongs here; WHETHER
#                          they are present is answered only by the probe. A missing
#                          tool (or a probe that did not answer) fails the feature
#                          closed.
#   note                   the reason, surfaced verbatim in the agent report and in
#                          the backend's rejection message.
#
# Auditing entries is part of the "onboarding a new version" procedure in
# docs/03-development/PED_MCP_CAPABILITIES.md.

features:
  - key: modules
    feature: "Modules"
    available: true
    requires_tools: [ped_create_module]
    note: "CREATE"
  - key: entities
    feature: "Entities"
    available: true
    requires_tools: [ped_update_document]
    note: "CREATE/DROP (+ NOT NULL / UNIQUE validation rules on create); ALTER add/drop/rename attribute, entity & attribute documentation; attribute default values (Studio Pro 11.12+, via the value/defaultValue path-op); generalization (extends)"
  - key: associations
    feature: "Associations"
    available: true
    requires_tools: [ped_update_document]
    note: "CREATE/DROP within a module"
  - key: enumerations
    feature: "Enumerations"
    available: true
    requires_tools: [ped_create_document]
    note: "CREATE / DROP (DROP needs Studio Pro 11.16+, ped_delete_document)"
  - key: constants
    feature: "Constants"
    available: true
    requires_tools: [ped_update_document]
    note: "CREATE / CREATE OR MODIFY / DROP (String/Integer/Decimal/Boolean/DateTime)"
  - key: microflows
    feature: "Microflows"
    available: true
    requires_tools: [ped_update_document]
    note: "CREATE (broad activity + control-flow coverage)"
  - key: pages
    feature: "Pages"
    available: true
    # Pages are the one document type PED is forbidden for; they have their own
    # tool pair. 11.12 replaced pg_write_page with pg_patch_page, so a session
    # exposing neither cannot author pages at all.
    requires_tools: [pg_read_page, pg_patch_page]
    note: "CREATE + ALTER (widget coverage grows per type); ALTER page-level SET Title (maps onto the pg LightPage's top-level title). Url and pop-up settings (PopupWidth/Height/Resizable/CloseAction) are NOT on the pg LightPage shape (schema is additionalProperties:false) — set them in Studio Pro"
  - key: workflows
    feature: "Workflows"
    available: true
    requires_tools: [ped_update_document]
    note: "CREATE / CREATE OR REPLACE / DROP / ALTER (full, any nesting depth)"
  - key: view_entities
    feature: "View entities — CREATE"
    available: false
    note: "PED syncs a view entity's attributes to its OQL only via the LLM-backed oql_generate tool; its deterministic write tools leave attributes as StoredValue, out of sync with the query (CE6770). mxcli writes user OQL verbatim and does not invoke the generator, so it does not author view entities over MCP"
  - key: documents_into_folders
    feature: "Documents into folders"
    available: true
    requires_tools: [ped_create_document]
    note: "create <doc> … folder 'A/B' (nested; folder auto-created)"

  # Gated create rejections — the backend checks these keys via canAuthor().
  - key: nanoflow_create
    feature: "Nanoflows — CREATE"
    available: false
    note: "PED's create whitelist excludes Microflows$Nanoflow (it covers microflows, not nanoflows)"
  - key: javaaction_create
    feature: "Java actions — CREATE"
    available: false
    note: "PED won't create JavaActions$JavaAction (a Java action is backed by a .java source Studio Pro generates)"
  - key: businessevent_create
    feature: "Business-event services — CREATE"
    available: false
    note: "PED won't create BusinessEvents$BusinessEventService (off the create whitelist); the published-event entities & constants it relies on ARE creatable"

  # Display-only blocked rows (not method-gated — these are whole features the backend
  # doesn't implement, or PED-fundamental limits unlikely to be lifted).
  - key: navigation
    feature: "Navigation (web profile: home page, login/not-found page, menu tree)"
    available: true
    requires_tools: [ped_update_document]
    note: "CREATE OR REPLACE NAVIGATION on a web profile, via generic ped_update_document path-ops on the project-level Navigation$NavigationDocument (menu items use Menus$MenuItem + Pages$*ClientAction; the menu is cleared then rebuilt). Native profiles (bottom-bar items, native home) and role-based home pages are not authored yet"
  - key: entity_access_rules
    feature: "Entity access rules (GRANT)"
    available: true
    requires_tools: [ped_update_document]
    note: "GRANT a NEW entity access rule for an existing role — the rule lives on DomainModels$Entity.accessRules (the domain-model document PED authors), NOT the security document. ADD-only: PED refuses to remove DomainModels$AccessRule / DomainModels$MemberAccess, so REVOKE and replacing an existing rule in place are rejected (edit in Studio Pro). The referenced module role must already exist"
  - key: security_roles
    feature: "Security roles & settings — module roles, user roles, demo users, project security settings"
    available: false
    note: "PED reports 'Unknown document type' for Security$ProjectSecurity and Security$ModuleSecurity — the security documents are not exposed, so roles/users/settings cannot be authored over MCP (entity access *rules* are separate — see entity_access_rules)"
  - key: integrations_settings
    feature: "OData/REST, mappings, project settings"
    available: false
    note: "no PED write path"
  - key: attribute_type_change
    feature: "ALTER … MODIFY attribute type"
    available: false
    note: "PED can't change a type in place (would drop the column)"
  - key: entity_slice_gaps
    feature: "Entity defaults, indexes, non-persistent entities, event handlers, system members"
    available: false
    note: "the entity slice authors plain attributes + NOT NULL/UNIQUE; default values, indexes, and non-persistent entities are not built yet (and PED's entity constructor exposes no persistable flag)"
  - key: document_move
    feature: "MOVE / re-parent a document, empty CREATE FOLDER"
    available: false
    note: "PED can't re-parent documents or create empty folders"
  - key: pages_foldered
    feature: "Pages into folders"
    available: false
    note: "pg_patch_page has no folderPath param (page lands at the module root)"
